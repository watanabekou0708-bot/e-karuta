<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ただいまプレイできません（貼り紙）</title>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    margin: 0; color: #1c2540; background: #fff;
    font-family: "Yu Gothic UI", "Yu Gothic", "Meiryo", "MS PGothic", sans-serif;
  }
  .page { width: 210mm; height: 297mm; position: relative; padding: 0; }
  .frame {
    position: absolute; inset: 12mm; border: 4mm solid #b33a4d; border-radius: 8mm;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 10mm;
  }
  h1 { font-size: 54pt; line-height: 1.3; color: #b33a4d; margin: 0 0 10mm; }
  p { font-size: 26pt; line-height: 1.7; margin: 0; }
  .club { position: absolute; bottom: 14mm; font-size: 18pt; color: #7a86a8; }
</style>
</head>
<body>
<section class="page">
  <div class="frame">
    <h1>ただいま<br>プレイできません</h1>
    <p>ごめんなさい。<br>ゲームの調子が悪いため、<br>しばらくお待ちください。</p>
    <p style="margin-top:12mm;font-size:20pt;color:#555">準備ができしだい、再開します。</p>
    <div class="club">Webデザインサークル｜Webかるた</div>
  </div>
</section>
</body>
</html>
