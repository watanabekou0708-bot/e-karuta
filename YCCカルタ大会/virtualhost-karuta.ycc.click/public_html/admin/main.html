<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=no">
        <title>HTML5カルタ大会 | 管理</title>
        <link rel="icon" href="/favicon.ico">
        <link rel="stylesheet" href="/css/reset.css">
        <link rel="stylesheet" href="/css/styleCommon.css">
        <link rel="stylesheet" href="/css/stylePC.css"      media="screen and (min-width:1024px)                                                  "><!-- 300M -->
        <link rel="stylesheet" href="/css/styleMobileV.css" media="screen and                        (max-width: 414px) and (orientation:portrait)"><!--  60Y  320*1, 320*2, 412*2.625, 414*3-->
        <link rel="stylesheet" href="/css/styleMobileH.css" media="screen and (min-width: 480px) and (max-width: 736px) and (orientation:landscape)"><!--120G  480*1, 568*2, 684*2.625, 736*3-->
        <link rel="stylesheet" href="/css/styleTabletV.css" media="screen and (min-width: 768px) and (max-width:1024px) and (orientation:portrait)"><!-- 180C  768*2, 800*1,1024*2-->
        <link rel="stylesheet" href="/css/styleTabletH.css" media="screen and (min-width:1024px) and (max-width:1366px) and (orientation:landscape)"><!--240B 1024*2,1280*1,1366*2-->
        <link rel="stylesheet" href="/css/stylePrint.css"   media="print">
        <link rel="stylesheet" href="/css/styleFullScreen.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body id="tgtFull">
<!-- デバイスの解像度を表示する
        <script>
            document.write("devicePixelRatio" + ":" + window.devicePixelRatio + "<br>");
            document.write("innerWidth/innerHeight" + ":" + window.innerWidth + "/" + window.innerHeight + "<br>");
            document.write("orientation" + ":" + window.orientation + "<br>");
        </script>
-->
        <!--全画面切り替えボタン-->
        <button id="btnFull" onclick="requestFullscreen()"><i class="fa fa-window-maximize fa-3x" aria-hidden="true"></i></button>
        <!--//全画面切り替えボタン-->
        <input type="button" value="ログアウト" onclick="logout()"><br>
        <div id="contents">
            <div>審判用端末の状態</div>
            <div id="btnSystem">
                <div>一斉送信</div>
                <div>
                    <input type="button" value="準備中" onclick="setAdminDeviceInfo(this)">
                    <input type="button" value="抽選" onclick="setAdminDeviceInfo(this)"><br>
                    <input type="button" value="得点" onclick="setAdminDeviceInfo(this)"><br>
                </div>
            </div>
            <div id="userInfo"></div>
        </div>
        <div id="contents">
            <div>スコアボードの状態</div>
            <div id="btnScore">
                <div>一斉送信</div>
                <div>
                    <input type="button" value="第１回戦" onclick="setScoreBord(1)">
                    <input type="button" value="第２回戦" onclick="setScoreBord(2)">
                    <input type="button" value="第３回戦" onclick="setScoreBord(3)">
                    <input type="button" value="第４回戦" onclick="setScoreBord(4)">
                    <input type="button" value="（３位決定戦）" onclick="setScoreBord(5)">
                    <input type="button" value="決勝戦" onclick="setScoreBord(6)"><br>
                </div>
            </div>
            <div id="scoreInfo"></div>
        </div>
        <div id="contents">
            <div>データベースの状態</div>
            <div id="btnDatabase">
                <input id="btnReset" type="button" value="組み合わせテーブルの新規作成→対戦成績の初期化→準備中を送信" onclick="reset()"><br>
            </div>
            <div id="tBattleTable">
                <table border="1">
                    <thead>
                        <tr>
                            <th>競技回数</th>
                            <th>抽選開催回</th>
                            <th>抽選人数/参加人数</th>
                            <th>使用テーブル数</th>
                            <th>テーブルごとの人数</th>
                            <th>テーブルごとの勝ち上がり人数</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <style>
            #tBattleTable {
            }
            #tBattleTable table {
                border-collapse: collapse;
                border-top: solid 1px black;
                border-right: solid 1px black;
            }
            #tBattleTable table th,
            #tBattleTable table td {
                border-left: solid 1px black;
                border-bottom: solid 1px black;
                text-align: center;
                padding: 0.3rem 0.5rem;
            }
            #tBattleTable table th {
                background-color: darkgray;
                font-weight: bold;
            }
            #tBattleTable table td {
                font-size: 1.3rem;
            }
            #tBattleTable table td span {
                font-color: navy;
                font-weight: 900;
                padding-right: 0.3rem;
            }
        </style>
        <script src="/js/jquery-3.1.1.min.js"></script>
        <script src="/js/common.js"></script>
        <script src="script.js"></script>
    </body>
</html>
