<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>全画面表示サンプル</title>
        <style>
            #target:-webkit-full-screen {
                position : absolute ;
                left     : 0 ;
                top      : 0 ;
                width    : 100% ;
                height   : 100% ;
            }
            #target:-moz-full-screen {
                position : absolute ;
                left     : 0 ;
                top      : 0 ;
                width    : 100% ;
                height   : 100% ;
            }
            #target:-ms-fullscreen {
                position : absolute ;
                left     : 0 ;
                top      : 0 ;
                width    : 100% ;
                height   : 100% ;
            }
            #target:fullscreen {
                position : absolute ;
                left     : 0 ;
                top      : 0 ;
                width    : 100% ;
                height   : 100% ;
            }
        </style>
	</head>
	<body>
        <!--フルスクリーン表示対象ここから-->
        <div id="target">
            <script>
                document.write("devicePixelRatio" + ":" + window.devicePixelRatio + "<br>");
                document.write("innerWidth/innerHeight" + ":" + window.innerWidth + "/" + window.innerHeight + "<br>");
                document.write("orientation" + ":" + window.orientation + "<br>");
                document.write("document.uniqueID" + ":" + document.uniqueID + "<br>");
                document.write("document.documentMode" + ":" + document.documentMode + "<br>");
            </script>
            <video controls="">
                <source src="xxx.webm">
                <source src="xxx.mp4">
            </video>
            <!--切り替えボタン-->
            <button id="fullscreenSwitch" onclick="requestFullscreen()">フルスクリーンにする</button>
            <!--//切り替えボタン-->
        </div>
        <!--//フルスクリーン表示対象ここまで-->
        <script>
            var target = document.getElementById("target");
            var btn    = document.getElementById("fullscreenSwitch");
            // フルスクリーンイベントを検知する
            document.addEventListener("webkitfullscreenchange", handleFSevent, false);
            document.addEventListener("mozfullscreenchange", handleFSevent, false);
            document.addEventListener("MSFullscreenChange", handleFSevent, false);
            document.addEventListener("fullscreenchange", handleFSevent, false);
            function handleFSevent() {
                if( (document.webkitFullscreenElement && document.webkitFullscreenElement !== null)
                 || (document.mozFullScreenElement && document.mozFullScreenElement !== null)
                 || (document.msFullscreenElement && document.msFullscreenElement !== null)
                 || (document.fullScreenElement && document.fullScreenElement !== null) ) {
                    alert(getFSelment()+"\nフルスクリーン表示を実行しました。");
                }else{
                    alert(getFSelment()+"\nフルスクリーン表示を終了しました。"); 
                }
            }
            // フルスクリーン表示の要素を取得
            function getFSelment() {
                if (document.webkitFullscreenElement) {
                    return document.webkitFullscreenElement;
                } else if (document.mozFullScreenElement) {
                    return document.mozFullScreenElement;
                } else if (document.msFullscreenElement) {
                    return document.msFullscreenElement;
                } else if (document.fullscreenElement) {
                    return document.fullscreenElement;
                }
            }
            /*フルスクリーン実行用ファンクション*/
            function requestFullscreen() {
                if (target.webkitRequestFullscreen) {
                    target.webkitRequestFullscreen(); //Chrome15+, Safari5.1+, Opera15+
                } else if (target.mozRequestFullScreen) {
                    target.mozRequestFullScreen(); //FF10+
                } else if (target.msRequestFullscreen) {
                    target.msRequestFullscreen(); //IE11+
                } else if (target.requestFullscreen) {
                    target.requestFullscreen(); // HTML5 Fullscreen API仕様
                } else {
                    alert('ご利用のブラウザはフルスクリーン操作に対応していません');
                    return;
                }
                /*フルスクリーン終了用ファンクションボタンに切り替える*/
                btn.onclick = exitFullscreen;
                btn.innerText = "フルスクリーンを終了する";
            }
            /*フルスクリーン終了用ファンクション*/
            function exitFullscreen() {
                if (document.webkitCancelFullScreen) {
                    document.webkitCancelFullScreen(); //Chrome15+, Safari5.1+, Opera15+
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen(); //FF10+
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen(); //IE11+
                } else if(document.cancelFullScreen) {
                    document.cancelFullScreen(); //Gecko:FullScreenAPI仕様
                } else if(document.exitFullscreen) {
                    document.exitFullscreen(); // HTML5 Fullscreen API仕様
                }
                /*フルスクリーン実行用ファンクションボタンに切り替える*/
                btn.onclick = requestFullscreen;
                btn.innerText = "フルスクリーンにする";
            }
            /*サポートしていないIE10以下とスマフォではフルスクリーンボタンを非表示*/
            if(typeof window.orientation != "undefined" || (document.uniqueID && document.documentMode < 11)){
                // btn.style.display = "none";
            }
        </script>
	</body>
</html>
