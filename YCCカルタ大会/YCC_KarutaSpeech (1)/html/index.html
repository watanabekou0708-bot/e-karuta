    <script>
        // ボタン内のテキストサイズを調整
        span = document.querySelector('#hideDiv span')
        button = document.querySelectorAll('button[class^=card]')
        for (let i = 0; i < button.length; i++) {
            span.textContent = button[i].textContent
            margin = (button[i].offsetWidth - button[i].clientWidth) * 2
            if (span.clientWidth > button[i].offsetWidth - (margin * 2)) {
                button[i].innerHTML = '<span>'+button[i].textContent+'</span>'
                ratio = (button[i].offsetWidth - (margin * 2) - 2) / span.clientWidth
                button[i].children[0].style.display = 'inline-block'
                button[i].children[0].style.transformOrigin = 0
                button[i].children[0].style.transform = 'scaleX('+ratio+')'
                button[i].children[0].style.width = (100 / ratio - (margin * 3))+'px'
            }
        }
        var als = {}
        document.querySelector('#connect').onclick = function() {
            // 1.0
            ip = document.querySelector('#ip').value
            qis = new QiSession(ip)
            qis.socket()
            .on('connect', function() {
                document.querySelector('.result').textContent = '[CONNECTED]'
                qis.service('ALTextToSpeech').done(function(ins) {
                    als.alTextToSpeech = ins
                })
                qis.service('ALMotion').done(function(ins) {
                    als.alMotion = ins
                })
                qis.service('ALRobotPosture').done(function(ins) {
                    als.alRobotPosture = ins
                })
                qis.service('ALAudioDevice').done(function(ins) {
                    als.alALAudioDevice = ins
                    als.alALAudioDevice.setOutputVolume(50)
                })
                qis.service('ALAnimatedSpeech').done(function(ins) {
                    als.alAnimatedSpeech = ins
                })
                qis.service('ALTabletService').done(function(ins) {
                    als.alALTabletService = ins
                    // als.alALTabletService.loadUrl("https://www.yc-c.ac.jp/");
                })
                qis.service('ALAutonomousLife').done(function(ins) {
                    als.alALAutonomousLife = ins
                    // als.alALAutonomousLife.setState("disabled");
                    als.alALAutonomousLife.setState("safeguard");
                })
                qis.service('ALBehaviorManager').done(function(ins) {
                    als.alALBehaviorManager = ins
                })
                qis.service('ALBattery').done(function(ins) {
                    als.alALBattery = ins
                })
                qis.service('ALBasicAwareness').done(function(ins) {
                    als.alALBasicAwareness = ins
                })
                qis.service('ALAutonomousMoves').done(function(ins) {
                    als.alALAutonomousMoves = ins
                })
                qis.service('ALLeds').done(function(ins) {
                    als.alALLeds = ins
                })
                qis.service('ALSystem').done(function(ins) {
                    als.alALSystem = ins
                })
            })
            .on('disconnect', function() {
                document.querySelector('.result').textContent = '[Disconnected]'
            })
            .on('error', function() {
                document.querySelector('.result').textContent = '[Connection Error]'
            })
            // 2
            // ip = document.querySelector('#ip').value
            // QiSession(function(session) {
            //     document.querySelector('.result').textContent = '[Connected]'
            //     session.service('ALTextToSpeech').then(function(tts) {
            //         als.alTextToSpeech = tts
            //     }, function(error){
            //         document.querySelector('.result').textContent = '[Error]'
            //     })
            // }, function () {
            //     document.querySelector('.result').textContent = '[Disconnected]'
            // }
            // , ip)
        }

        function speech(sentence) {
            if (als.alTextToSpeech) als.alTextToSpeech.say('\\vct=135\\\\rspd=90\\\\vol=30\\' + sentence)
        }
        function read(elm, sentence, read) {
            if (elm.classList.contains('html')) elm.classList.replace('html', 'htmlx')
            if (elm.classList.contains('excel')) elm.classList.replace('excel', 'excelx')
            if (elm.classList.contains('business')) elm.classList.replace('business', 'businessx')
            if (elm.classList.contains('noCard')) elm.classList.replace('noCard', 'noCardx')
            if (als.alTextToSpeech) {
            	als.alTextToSpeech.say('\\vct=135\\\\rspd=90\\\\vol=30\\' + 'よみあげます')
            	setTimeout(function() {
	            	als.alAnimatedSpeech.say('\\vct=135\\\\rspd=90\\\\vol=30\\' + sentence)
	            	setTimeout(function() {
		            	als.alTextToSpeech.say('\\vct=135\\\\rspd=90\\\\vol=30\\' + 'そコ^マで！')
		            	setTimeout(function() {
			            	als.alAnimatedSpeech.say('\\vct=135\\\\rspd=90\\\\vol=30\\' + '正解は、' + read + 'デス')
		            	}, 4000)
	            	}, 11000)
            	}, 3000)
            }
        }
    </script>
