<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webかるた — 勝敗一覧</title>
  <link rel="stylesheet" href="status.css">
</head>
<body>
<div class="st-wrap">
  <header class="st-head">
    <h1>📋 勝敗一覧</h1>
    <div class="st-now" id="stNow">読み込み中…</div>
  </header>

  <div id="stForbidden" class="st-card hidden">
    この画面は教卓PC（サーバーを起動しているパソコン）から、ロビーの「勝敗一覧を開く」で開いてください。
  </div>

  <div id="stBody">
    <!-- 状態ごとの人数（クリックで絞り込み） -->
    <div class="st-summary" id="stSummary"></div>
    <div class="st-tools">
      <input id="stSearch" type="search" placeholder="名前で検索">
      <span class="st-hint" id="stUpdated"></span>
    </div>
    <!-- いま効いている絞り込み条件（押すと解除） -->
    <div class="st-active" id="stActive"></div>
    <div class="st-table-wrap">
      <table class="st-table">
        <thead id="stHead"></thead>
        <tbody id="stRows"></tbody>
      </table>
    </div>
    <p class="st-hint">見出しの名前を押すと並び替え、▼を押すと並び替えと絞り込みができます。結果の列の並び替えと絞り込みは、直近の試合の結果が対象です。画面は自動で更新されます。</p>
  </div>
  <!-- 見出しの▼で開く、並び替え・絞り込みのメニュー -->
  <div class="st-menu hidden" id="stMenu"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="status.js"></script>
</body>
</html>
