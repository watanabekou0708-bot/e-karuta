<title>勝敗一覧デザイン案</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* レイアウト：上に案の切り替え、その下に実際の勝敗一覧と同じ幅の画面。色は public/status.css に合わせる */
:root { --bg:#f4f6fb; --card:#fff; --text:#1d2433; --mute:#5a6078; --line:#d5dbea; --indigo:#1f2a5a; --on-indigo:#fff; --hi:#eef1fb;
  --alive:#1f8a4c; --alive-bg:#e3f6ea; --wait:#8a5200; --wait-bg:#fff1d6; --out:#b3261e; --out-bg:#fde7e5;
  --play:#1f4fb3; --play-bg:#e3ecff; --final:#7a2fb3; --final-bg:#f0e4fb; --idle:#5a6078; --idle-bg:#eceff6;
  --font:'Meiryo','Yu Gothic UI',system-ui,sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#12162a; --card:#1b2140; --text:#e8ebf7; --mute:#9aa3c7; --line:#2d355f; --indigo:#cfd6ff; --on-indigo:#12162a; --hi:#252d55;
  --alive:#6fe0a0; --alive-bg:#16382a; --wait:#ffc766; --wait-bg:#3d2e10; --out:#ff9a92; --out-bg:#43201e;
  --play:#8fb2ff; --play-bg:#1a2c5c; --final:#d7a8ff; --final-bg:#33204a; --idle:#9aa3c7; --idle-bg:#242b4d; color-scheme:dark; } }
:root[data-theme="dark"] { --bg:#12162a; --card:#1b2140; --text:#e8ebf7; --mute:#9aa3c7; --line:#2d355f; --indigo:#cfd6ff; --on-indigo:#12162a; --hi:#252d55;
  --alive:#6fe0a0; --alive-bg:#16382a; --wait:#ffc766; --wait-bg:#3d2e10; --out:#ff9a92; --out-bg:#43201e;
  --play:#8fb2ff; --play-bg:#1a2c5c; --final:#d7a8ff; --final-bg:#33204a; --idle:#9aa3c7; --idle-bg:#242b4d; color-scheme:dark; }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:var(--font); padding-block:16px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
.wrap { max-width:1200px; margin:0 auto; }
h1 { font-size:1.4rem; color:var(--indigo); margin:0 0 4px; }
.note { color:var(--mute); margin:0 0 10px; line-height:1.6; }
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:3px solid #e6a100; outline-offset:1px; }
.tabs { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
.tabs button { background:var(--card); border:2px solid var(--line); border-radius:10px; padding:8px 14px; font-weight:700; }
.tabs button[aria-pressed="true"] { background:var(--indigo); border-color:var(--indigo); color:var(--on-indigo); }
.desc { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; line-height:1.7; margin-bottom:12px; }
.bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
.ctl { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; max-width:100%; }
.count { color:var(--mute); }
.layout.side { display:grid; grid-template-columns:230px minmax(0,1fr); gap:12px; align-items:start; }
@media (max-width:820px) { .layout.side { grid-template-columns:minmax(0,1fr); } }
.panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
.panel fieldset { border:0; padding:0; margin:0 0 12px; }
.panel legend { font-weight:700; color:var(--indigo); padding:0; margin-bottom:4px; }
.checks { display:flex; flex-wrap:wrap; gap:6px; }
.chip { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:4px 11px; font-size:.9rem; }
.chip[aria-pressed="true"] { background:var(--indigo); color:var(--on-indigo); border-color:var(--indigo); }
.table-wrap { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:auto; max-height:560px; }
table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
th, td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; white-space:nowrap; }
thead th { position:sticky; top:0; background:var(--card); color:var(--indigo); z-index:1; }
thead tr.filters th { top:41px; padding-block:4px 8px; }
.filters .ctl { width:100%; min-width:90px; font-weight:400; font-size:.9rem; padding:4px 6px; }
.sort { background:none; border:0; padding:0; font-weight:700; color:inherit; }
.sort .arrow { display:inline-block; width:1.2em; }
.menu-btn { background:none; border:1px solid var(--line); border-radius:6px; padding:0 6px; margin-left:6px; }
.menu-btn.on { background:var(--indigo); color:var(--on-indigo); }
.menu { position:fixed; z-index:20; background:var(--card); border:1px solid var(--indigo); border-radius:10px; padding:10px; width:250px; max-width:calc(100vw - 32px); max-height:340px; overflow:auto; box-shadow:0 8px 24px rgba(0,0,0,.28); }
.menu button.item { display:block; width:100%; text-align:left; background:none; border:0; border-radius:6px; padding:6px 8px; }
.menu button.item:hover { background:var(--hi); }
.menu label { display:flex; gap:8px; padding:4px 8px; }
.menu hr { border:0; border-top:1px solid var(--line); }
.active { display:flex; gap:6px; flex-wrap:wrap; min-height:30px; align-items:center; margin-bottom:6px; }
.name { font-weight:700; }
.badge { display:inline-block; padding:3px 10px; border-radius:999px; font-weight:700; }
.res { display:inline-block; margin-right:6px; padding:2px 8px; border-radius:6px; font-size:.9rem; }
.final { background:var(--final-bg); color:var(--final); } .playing { background:var(--play-bg); color:var(--play); }
.alive, .pass { background:var(--alive-bg); color:var(--alive); } .wait { background:var(--wait-bg); color:var(--wait); }
.out { background:var(--out-bg); color:var(--out); } .idle { background:var(--idle-bg); color:var(--idle); }
.none { color:var(--mute); }
</style>

<div class="wrap">
  <h1>勝敗一覧デザイン案</h1>
  <p class="note">3案とも「学年」と「コース」を別の列に分けています。実際に並び替えと絞り込みを試せます。表の名前と結果はすべて架空の見本です。</p>
  <div class="tabs" id="tabs">
    <button data-p="a" aria-pressed="true">案A　見出しの下に絞り込み欄</button>
    <button data-p="b" aria-pressed="false">案B　左側の絞り込みパネル</button>
    <button data-p="c" aria-pressed="false">案C　見出しの▼メニュー（Excel風）</button>
  </div>
  <div class="desc" id="desc"></div>
  <div class="bar" id="bar"></div>
  <div class="active" id="active"></div>
  <div class="layout" id="layout">
    <div class="panel" id="panel" hidden></div>
    <div class="table-wrap" id="tableWrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div>
  </div>
  <div class="menu" id="menu" hidden></div>
</div>

<script>
const STATES = [['final','最終順位'],['playing','試合中'],['alive','本戦 勝ち残り'],['wait','復活戦 挑戦待ち'],['out','敗退'],['idle','未出場']];
const COURSES = ['アプリコース','プログラムコース','ITスペシャリストコース','画像クリエイトコース','ITエンジニアコース','ビジュアルデザインコース','ビジネスITコース'];
const BY_GRADE = {1:[0,1],2:[2,3,4,5,6],3:[2,3]};
const FAMILY = ['あおき','いしだ','うえの','えんどう','おがわ','かとう','きむら','くどう','こばやし','さかい','しみず','たなか','なかむら','はら','ふじた','まつもと','みうら','やまもと','よしだ','わだ'];
const GIVEN = ['あおい','はると','ゆい','そうた','りん','みなと','ひなた','れん','さくら','ゆうき'];
const DATA = Array.from({length:36}, (_, i) => {
  const grade = [1,2,3][i % 3], list = BY_GRADE[grade];
  const state = ['alive','alive','alive','wait','wait','out','out','idle'][(i * 5) % 8];
  const score = 800 + (i * 977) % 5200, rank = 1 + (i * 7) % 36;
  const main = state === 'idle' ? null : { result: state === 'alive' ? '通過' : '敗退', rank, score };
  const revival = state === 'out' ? { result:'敗退', rank:1 + i % 12, score:300 + (i * 389) % 2400 } : null;
  return { name: FAMILY[(i * 7) % 20] + ' ' + GIVEN[(i * 3) % 10], grade: grade + '年', course: COURSES[list[i % list.length]], state, main, revival };
});
const label = k => STATES.find(s => s[0] === k)[1];
const resText = h => h ? h.result : '結果なし';
const COLS = [
  { key:'name', title:'名前', get:r => r.name },
  { key:'grade', title:'学年', get:r => r.grade, options:['1年','2年','3年'] },
  { key:'course', title:'コース', get:r => r.course, options:COURSES },
  { key:'state', title:'いまの状態', get:r => label(r.state), options:STATES.map(s => s[1]), order:r => STATES.findIndex(s => s[0] === r.state) },
  { key:'main', title:'本戦の結果', get:r => resText(r.main), options:['通過','敗退','結果なし'], order:r => r.main ? -r.main.score : 1, hint:'点数の高い順' },
  { key:'revival', title:'敗者復活戦の結果', get:r => resText(r.revival), options:['通過','敗退','結果なし'], order:r => r.revival ? -r.revival.score : 1, hint:'点数の高い順' },
];
const DESC = {
  a:'<b>案A</b>　見出しを押すと並び替え、見出しの下の欄で列ごとに絞り込みます。すべての操作が常に見えていて、迷いにくい形です。画面の変更は表の部分だけで済みます。',
  b:'<b>案B</b>　左側のボタンで絞り込みます。学年やコースは複数選べます。今の条件がひと目で分かり、大会中に教卓PCで素早く切り替えられます。表の横幅は少し狭くなります。',
  c:'<b>案C</b>　見出しの▼を押すと、並び替えとチェックボックスが開きます。Excelのフィルターと同じ感覚で使えます。表は広く使えますが、1回多く押す必要があります。',
};
let plan = 'a', sort = { key:'state', dir:1 }, query = '', picked = {}, openCol = null;
const $ = id => document.getElementById(id);
const set = k => picked[k] || (picked[k] = new Set());
const filtered = () => DATA.filter(r => (!query || r.name.includes(query)) && COLS.every(c => !c.options || !set(c.key).size || set(c.key).has(c.get(r))));
const collator = new Intl.Collator('ja', { numeric:true });
function sorted(list) {
  const c = COLS.find(x => x.key === sort.key);
  return [...list].sort((a, b) => sort.dir * (c.order ? c.order(a) - c.order(b) : c.options ? c.options.indexOf(c.get(a)) - c.options.indexOf(c.get(b)) : collator.compare(c.get(a), c.get(b))) || collator.compare(a.name, b.name));
}
const res = h => h ? `<span class="res ${h.result === '通過' ? 'pass' : 'out'}">${h.result}（${h.rank}位・${h.score}点）</span>` : '<span class="none">—</span>';

function renderRows() {
  const list = sorted(filtered());
  $('rows').innerHTML = list.map(r => `<tr><td class="name">${r.name}</td><td>${r.grade}</td><td>${r.course}</td><td><span class="badge ${r.state}">${label(r.state)}</span></td><td>${res(r.main)}</td><td>${res(r.revival)}</td></tr>`).join('')
    || '<tr><td colspan="6" class="none">該当する参加者がいません。条件を解除してください。</td></tr>';
  const chips = [];
  if (query) chips.push(`<button class="chip" data-clear="name">名前「${query.replace(/[<>&"]/g, '')}」 ×</button>`);
  COLS.forEach(c => set(c.key).forEach(v => chips.push(`<button class="chip" data-clear="${c.key}" data-v="${v}">${c.title}：${v} ×</button>`)));
  $('active').innerHTML = `<span class="count">${list.length} / ${DATA.length}人を表示</span>` + chips.join('') + (chips.length ? '<button class="chip" data-clear="all">条件をすべて解除</button>' : '');
}
function renderControls() {
  $('desc').innerHTML = DESC[plan];
  const search = `<input class="ctl" id="q" type="search" placeholder="名前で検索" aria-label="名前で検索">`;
  $('bar').innerHTML = plan === 'a' ? '' : search + (plan === 'b' ? `<label>並び順 <select class="ctl" id="sortSel">${COLS.map(c => `<option value="${c.key}">${c.title}${c.hint ? '（' + c.hint + '）' : ''}</option>`).join('')}</select></label><button class="ctl" id="dirBtn">${sort.dir > 0 ? '▲ 昇順' : '▼ 降順'}</button>` : '');
  $('head').innerHTML = '<tr>' + COLS.map(c => `<th><button class="sort" data-sort="${c.key}">${c.title}<span class="arrow">${sort.key === c.key ? (sort.dir > 0 ? '▲' : '▼') : ''}</span></button>${plan === 'c' && c.options ? `<button class="menu-btn ${set(c.key).size ? 'on' : ''}" data-menu="${c.key}" aria-label="${c.title}の絞り込み">▼</button>` : ''}</th>`).join('') + '</tr>'
    + (plan === 'a' ? '<tr class="filters">' + COLS.map(c => c.options ? `<th><select class="ctl" id="f-${c.key}" data-col="${c.key}" aria-label="${c.title}で絞り込み"><option value="">すべて</option>${c.options.map(o => `<option ${set(c.key).has(o) ? 'selected' : ''}>${o}</option>`).join('')}</select></th>` : `<th>${search}</th>`).join('') + '</tr>' : '');
  $('panel').hidden = plan !== 'b';
  $('layout').classList.toggle('side', plan === 'b');
  $('panel').innerHTML = COLS.filter(c => c.options).map(c => `<fieldset><legend>${c.title}</legend><div class="checks">${c.options.map(o => `<button class="chip" data-col="${c.key}" data-chip="${o}" aria-pressed="${set(c.key).has(o)}">${o}</button>`).join('')}</div></fieldset>`).join('');
  if ($('q')) $('q').value = query;
  if ($('sortSel')) $('sortSel').value = sort.key;
}
function renderAll() { renderControls(); renderRows(); }
function closeMenu() { openCol = null; $('menu').hidden = true; }
function openMenu(key, anchor) {
  const c = COLS.find(x => x.key === key), m = $('menu'), box = anchor.getBoundingClientRect();
  openCol = key;
  m.innerHTML = `<button class="item" data-msort="1">▲ 昇順で並び替え</button><button class="item" data-msort="-1">▼ 降順で並び替え</button><hr>${c.options.map(o => `<label><input type="checkbox" value="${o}" ${set(key).has(o) ? 'checked' : ''}>${o}</label>`).join('')}<hr><button class="item" data-mclear="1">この列の条件を解除</button>`;
  m.hidden = false;
  m.style.left = Math.max(16, Math.min(box.left, innerWidth - m.offsetWidth - 16)) + 'px';
  m.style.top = Math.max(8, Math.min(box.bottom + 4, innerHeight - m.offsetHeight - 8)) + 'px';
}

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!e.target.closest('#menu') && !(t && t.dataset.menu)) closeMenu();
  if (!t) return;
  const d = t.dataset;
  if (d.p) { plan = d.p; closeMenu(); document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b === t)); renderAll(); }
  else if (d.sort) { sort = { key:d.sort, dir: sort.key === d.sort ? -sort.dir : 1 }; closeMenu(); renderAll(); }
  else if (d.menu) { openCol === d.menu ? closeMenu() : openMenu(d.menu, t); }
  else if (d.chip) { const s = set(d.col); s.has(d.chip) ? s.delete(d.chip) : s.add(d.chip); renderAll(); }
  else if (d.msort) { sort = { key:openCol, dir:+d.msort }; closeMenu(); renderAll(); }
  else if (d.mclear) { set(openCol).clear(); closeMenu(); renderAll(); }
  else if (d.clear) { if (d.clear === 'all') { picked = {}; query = ''; } else if (d.clear === 'name') query = ''; else set(d.clear).delete(d.v); renderAll(); }
  else if (t.id === 'dirBtn') { sort.dir = -sort.dir; renderAll(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { query = e.target.value.trim(); renderRows(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.closest('#menu')) { const s = set(openCol); t.checked ? s.add(t.value) : s.delete(t.value); document.querySelector(`[data-menu="${openCol}"]`).classList.toggle('on', s.size > 0); renderRows(); }
  else if (t.id === 'sortSel') { sort = { key:t.value, dir:1 }; renderAll(); }
  else if (t.tagName === 'SELECT' && t.dataset.col) { picked[t.dataset.col] = new Set(t.value ? [t.value] : []); renderRows(); }
});
renderAll();
</script>
