<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仕掛け第1段階モックアップ</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px; background: #1b130c; color: #f3e8cf; font-family: 'Yu Gothic UI', 'Meiryo', sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 1.1rem; margin: 0 0 8px; color: #e8c06a; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row b { width: 7.5em; font-size: .85rem; }
  button { font: inherit; font-size: .85rem; padding: .35rem .8rem; border-radius: 6px; border: 1px solid #73552f; background: #38291b; color: #f3e8cf; cursor: pointer; }
  button[aria-pressed="true"] { background: #e2ae4a; color: #221b13; font-weight: 700; }
  button.play { background: #2f6b25; border-color: #a8d46f; font-weight: 700; }
  .desc { font-size: .85rem; line-height: 1.6; background: #2b2016; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; min-height: 5.2em; }
  .main { display: flex; gap: 10px; align-items: flex-start; }
  .left { flex: 1; min-width: 0; }
  .reading { position: relative; background: linear-gradient(135deg, #f6eed9, #ecdfc0); border: 1px solid #b79f7c; border-left: 8px solid #c4382a; border-radius: 10px; color: #221b13; padding: .5rem 1rem; margin-bottom: 8px; font-family: 'Yu Mincho', serif; font-weight: 700; height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .reading.gold { background: linear-gradient(110deg, #ffe9a0, #f3c64a 45%, #fff3c4 55%, #e9b32f); background-size: 250% 100%; animation: shine 2.4s linear infinite; border-color: #8a5a00; }
  @keyframes shine { to { background-position: -250% 0; } }
  .reading .tag { background: #b8382a; color: #fff3dc; border-radius: 6px; padding: .15rem .6rem; white-space: nowrap; }
  .boardwrap { position: relative; width: 100%; aspect-ratio: 1280 / 880; overflow: hidden; border: 6px solid #3b2615; border-radius: 6px; background: #24180e; }
  .board { position: absolute; left: 0; top: 0; width: 1280px; height: 880px; transform-origin: 0 0; background: repeating-linear-gradient(90deg, #a9b778 0 6px, #9fae6e 6px 8px); }
  .board::before, .board::after { content: ''; position: absolute; left: 0; right: 0; height: 22px; background: #1f2a1d; }
  .board::before { top: 429px; } .board::after { bottom: 0; }
  .card { position: absolute; translate: -50% -50%; width: 180px; height: 100px; display: flex; align-items: center; justify-content: center; text-align: center; padding: .4rem; background: linear-gradient(160deg, #fbf5e6, #efe3c6); border: 2px solid #3a2c1e; border-radius: 4px; color: #1c1712; font: 700 24px/1.2 'Yu Mincho', serif; box-shadow: 0 3px 0 #b7a577, 0 6px 10px rgba(0,0,0,.4); cursor: pointer; user-select: none; z-index: 1; }
  .card.spinning { z-index: 3; box-shadow: 0 0 0 3px #e2ae4a, 0 8px 14px rgba(0,0,0,.45); }
  .home { position: absolute; left: 602px; top: 796px; width: 76px; height: 76px; border-radius: 50%; border: 4px solid #c4382a; background: rgba(246,238,217,.6); z-index: 2; }
  /* チャンス案A：中央の大きな帯 */
  .cutin { position: absolute; left: 0; right: 0; top: 34%; padding: 22px 0; text-align: center; background: linear-gradient(90deg, transparent, #b8382a 12%, #d9482f 50%, #b8382a 88%, transparent); color: #fff3dc; z-index: 20; pointer-events: none; animation: slide 2.6s ease both; }
  .cutin strong { display: block; font: 900 92px/1.15 'Yu Mincho', serif; text-shadow: 0 4px 0 #5a140c; }
  .cutin span { font-size: 34px; font-weight: 700; }
  @keyframes slide { 0% { transform: translateX(-100%); } 18%, 82% { transform: translateX(0); } 100% { transform: translateX(100%); opacity: 0; } }
  /* チャンス案C：盤面の金枠と隅の札 */
  .boardwrap.frame { border-color: #ffd34d; box-shadow: 0 0 0 4px #8a5a00, 0 0 28px 6px rgba(255,211,77,.75); }
  .corner { position: absolute; left: 16px; top: 380px; background: #ffd34d; color: #3a2200; border: 4px solid #8a5a00; border-radius: 10px; padding: 8px 20px; font: 900 40px/1.2 'Yu Mincho', serif; z-index: 20; pointer-events: none; }
  .side { width: 230px; flex: none; background: #f6eed9; color: #221b13; border-radius: 10px; padding: 10px 12px; font-size: .85rem; line-height: 1.7; }
  .side .big { font-size: 2rem; font-weight: 800; color: #9b2a1f; }
  .side .x2 { display: inline-block; background: #ffd34d; border: 2px solid #8a5a00; border-radius: 6px; padding: 0 .4rem; font-weight: 800; }
  .note { font-size: .8rem; color: #bfa883; margin-top: 6px; line-height: 1.6; }
  @media (max-width: 820px) { .main { flex-direction: column; } .side { width: 100%; } .left { width: 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>仕掛け 第1段階モックアップ（全員2倍チャンス ＋ 回転）</h1>
  <div class="row" id="chanceRow"><b>2倍の見せ方</b>
    <button data-v="A">案1 大きな帯</button><button data-v="B">案2 読み上げ欄が金色</button><button data-v="C">案3 盤面の金枠</button><button data-v="">なし</button></div>
  <div class="row" id="spinRow"><b>回転のしかた</b>
    <button data-v="A">案ア 全部回って止まる</button><button data-v="B">案イ 3枚だけ回り続ける</button><button data-v="C">案ウ 順番にくるり</button><button data-v="">なし</button></div>
  <div class="row"><b>操作</b><button class="play" id="playBtn">▶ 1枚分を再生</button><button id="newBtn">盤面を並べ直す</button>
    <label style="font-size:.85rem"><input type="checkbox" id="shrink"> 回転中の札を80%にする</label></div>
  <div class="desc" id="desc"></div>
  <div class="main">
    <div class="left">
      <div class="reading" id="reading"><span id="readText">「▶ 1枚分を再生」を押してください</span></div>
      <div class="boardwrap" id="boardwrap"><div class="board" id="board"></div></div>
    </div>
    <div class="side" id="side">再生中に読まれた用語の札をクリックすると、点数の例が出ます。</div>
  </div>
  <p class="note">札の配置はゲームと同じ処理で作っています。読み上げの音声は文字で代用し、時間は実際に近い長さです。得点は速度・精度の目安です（距離の点は省略）。強い点滅は使っていません。</p>
</div>
<script>
// ── 札の配置（public/layout.js と同じ処理の簡略版）──
const W = 180, H = 100, HOME = { x: 640, y: 834 };
const poly = (cx, cy, w, h, deg) => { const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); return [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([x,y]) => [cx+x*c-y*s, cy+x*s+y*c]); };
function overlap(A, B) { for (const P of [A, B]) for (let i = 0; i < P.length; i++) { const p = P[i], q = P[(i+1)%P.length], nx = p[1]-q[1], ny = q[0]-p[0]; const pr = Q => Q.map(v => v[0]*nx+v[1]*ny); const a = pr(A), b = pr(B); if (Math.max(...a) < Math.min(...b) || Math.max(...b) < Math.min(...a)) return false; } return true; }
function makeLayout() {
  for (let t = 0; t < 50; t++) {
    const out = [], polys = [poly(640, 834, 132, 132, 0)]; let ok = true;
    for (let i = 0; i < 10 && ok; i++) {
      const top = i < 5; let spot = null;
      for (let n = 0; n < 900 && !spot; n++) {
        const sp = n < 350 ? 1 : n < 650 ? .4 : .08;
        const rot = Math.round(top ? 180 + (Math.random()*24-12)*sp : (Math.random()*360-180)*sp);
        const a = rot*Math.PI/180, bw = Math.abs(W*Math.cos(a))+Math.abs(H*Math.sin(a)), bh = Math.abs(W*Math.sin(a))+Math.abs(H*Math.cos(a));
        const y0 = top ? 14 : 448, y1 = top ? 432 : 866;
        const x = bw/2+14+Math.random()*(1252-bw), y = y0+bh/2+Math.random()*(y1-y0-bh);
        const P = poly(x, y, W+20, H+20, rot);
        if (!polys.some(Q => overlap(P, Q))) { spot = { x, y, rot }; polys.push(P); }
      }
      if (spot) out.push(spot); else ok = false;
    }
    if (ok) return out;
  }
  return [];
}
// 回しても隣の札に重ならない札を、回転する札どうしも重ならないように n 枚選ぶ
function pickSafe(n, scale) {
  const radius = Math.hypot(W, H) / 2 * scale;
  const clear = i => { for (let d = 0; d < 180; d += 5) { const P = poly(layout[i].x, layout[i].y, W*scale, H*scale, d); if (layout.some((o, j) => j !== i && overlap(P, poly(o.x, o.y, W, H, o.rot)))) return false; } return true; };
  const order = [...layout.keys()].sort(() => Math.random()-.5).filter(clear), out = [];
  for (const i of order) { if (out.length < n && out.every(j => Math.hypot(layout[i].x-layout[j].x, layout[i].y-layout[j].y) >= radius*2)) out.push(i); }
  return out;
}

const WORDS = ['スプレッドシート','ファイアウォール','ブラウザ','アルゴリズム','ルータ','SUM関数','パスワード','データベース','プロトコル','圧縮'];
const CHANCE_TEXT = {
  A: '【案1 大きな帯】「マウスを定位置に戻します」の間に、赤い帯が盤面を横切ります。一番目立ち、盛り上がります。帯は読み上げが始まる前に消えるので、邪魔になりません。',
  B: '【案2 読み上げ欄が金色】読み上げ欄が金色に光り、「全員2倍」の札が付きます。落ち着いた見た目で、盤面は変わりません。気づかない人が出る可能性があります。',
  C: '【案3 盤面の金枠】盤面のふちが金色になり、中央の左に「全員2倍」を出し続けます。「そこまで」まで続くので、見逃しにくいです。',
  '': '2倍の表示はありません。',
};
const SPIN_TEXT = {
  A: '【案ア 全部回って止まる】全部の札が回り、「読み上げます」から約4秒でゆっくり元の向きに止まります。迫力は一番です。回っている間は隣の札に重なることがあります（80%にすると減りますが、なくなりません）。',
  B: '【案イ 3枚だけ回り続ける（おすすめ）】隣に重ならない札を3枚選び、「そこまで」までゆっくり回し続けます。重なりがないので、押し間違いが起きにくいです。回る札は、読まれる札とは関係なくランダムに選びます。',
  C: '【案ウ 順番にくるり】重ならない札が、1枚ずつ順番に1回転します。波のような楽しい動きで、難しさは控えめです。',
  '': '回転はありません。',
};
let chance = 'A', spin = 'B', layout = [], cards = [], raf = 0, timers = [], answer = -1, startAt = 0, clicked = true;
const $ = id => document.getElementById(id);
const board = $('board');

function fit() { board.style.transform = `scale(${$('boardwrap').clientWidth / 1280})`; }
function build() {
  stop(); layout = makeLayout(); board.innerHTML = '<div class="home"></div>';
  cards = layout.map((l, i) => { const d = document.createElement('div'); d.className = 'card'; d.textContent = WORDS[i]; d.style.cssText = `left:${l.x}px;top:${l.y}px;transform:rotate(${l.rot}deg)`; d.addEventListener('click', e => hit(i, e)); board.appendChild(d); return d; });
  fit();
}
function stop() {
  cancelAnimationFrame(raf); timers.forEach(clearTimeout); timers = []; clicked = true;
  board.querySelectorAll('.cutin,.corner').forEach(e => e.remove());
  $('boardwrap').classList.remove('frame'); $('reading').classList.remove('gold'); $('reading').querySelector('.tag')?.remove();
  cards.forEach((c, i) => { c.classList.remove('spinning'); c.style.transform = `rotate(${layout[i].rot}deg)`; });
}
const later = (ms, fn) => timers.push(setTimeout(fn, ms));
const addBoard = (cls, html) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; board.appendChild(d); return d; };

function play() {
  stop();
  answer = Math.floor(Math.random()*10);
  $('side').innerHTML = '読まれた用語の札をクリックしてください。';
  $('readText').textContent = 'マウスを定位置に戻します。フライングに注意してください。';
  if (chance === 'A') addBoard('cutin', '<strong>全員2倍チャンス！</strong><span>正しい札を取れた人は、みんな点数が2倍</span>');
  if (chance === 'B') { $('reading').classList.add('gold'); $('reading').insertAdjacentHTML('beforeend', '<span class="tag">全員2倍チャンス</span>'); }
  if (chance === 'C') { $('boardwrap').classList.add('frame'); addBoard('corner', '全員2倍'); }
  later(2800, () => {
    board.querySelector('.cutin')?.remove();
    $('readText').textContent = '読み上げます';
    startAt = performance.now(); clicked = false; startSpin();
  });
  later(2800 + 1900, () => { $('readText').textContent = `（上の句の代わり）「${WORDS[answer]}」を取ってください`; });
  later(2800 + 10500, () => { $('readText').textContent = 'そこまで！'; stop(); });
}
function startSpin() {
  if (!spin) return;
  const small = $('shrink').checked ? .8 : 1;
  const targets = spin === 'A' ? [...cards.keys()] : pickSafe(spin === 'B' ? 3 : 8, small);
  const t0 = performance.now();
  const frame = now => {
    const s = (now - t0) / 1000;
    targets.forEach((i, k) => {
      let add = 0, active = true;
      if (spin === 'A') { const p = Math.min(1, s/4); add = 720 * (1 - Math.pow(1-p, 3)); active = p < 1; }
      if (spin === 'B') add = s * 90 * (k % 2 ? -1 : 1);                       // 4秒で1回転
      if (spin === 'C') { const p = Math.min(1, Math.max(0, (s - k*.45) % 4.5)); add = 360 * (p*p*(3-2*p)); active = p > 0 && p < 1; if (s < k*.45) { add = 0; active = false; } }
      cards[i].classList.toggle('spinning', active);
      cards[i].style.transform = `rotate(${layout[i].rot + add}deg) scale(${active ? small : 1})`;
    });
    raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
}
function hit(i, e) {
  if (clicked) return;
  clicked = true;
  const r = board.getBoundingClientRect(), k = r.width / 1280;
  const mm = Math.hypot((e.clientX-r.left)/k - layout[i].x, (e.clientY-r.top)/k - layout[i].y) * 73/180;
  if (i !== answer) { $('side').innerHTML = 'お手付き<div class="big">−50点</div>（2倍のときも減点は変えない案）'; return; }
  const ms = performance.now() - startAt;
  const speed = Math.round(200 * Math.min(1, Math.max(0, (8500-ms)/6000)));
  const acc = Math.round(200 * Math.pow(1 - Math.min(1, mm/41.8), 3));
  const base = speed + acc, bonus = speed >= 150 && acc >= 150 ? 500 : 0, x = chance ? 2 : 1;
  $('side').innerHTML = `速度 ${speed}点（${(ms/1000).toFixed(2)}秒）<br>精度 ${acc}点（中心から${mm.toFixed(1)}mm）<br>ボーナス ${bonus}点<hr>` +
    (x === 2 ? `<span class="x2">全員2倍</span><br>(${base}) × 2 ＋ ${bonus}<div class="big">${base*2 + bonus}点</div>ボーナス500点は2倍にしない場合の例です。` : `<div class="big">${base + bonus}点</div>`);
}
function select(rowId, v) { document.querySelectorAll(`#${rowId} button`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); }
function refresh() { select('chanceRow', chance); select('spinRow', spin); $('desc').innerHTML = CHANCE_TEXT[chance] + '<br>' + SPIN_TEXT[spin]; }
$('chanceRow').addEventListener('click', e => { if (e.target.dataset.v === undefined) return; chance = e.target.dataset.v; stop(); refresh(); });
$('spinRow').addEventListener('click', e => { if (e.target.dataset.v === undefined) return; spin = e.target.dataset.v; stop(); refresh(); });
$('playBtn').addEventListener('click', play);
$('newBtn').addEventListener('click', build);
addEventListener('resize', fit);
build(); refresh();
</script>
</body>
</html>
